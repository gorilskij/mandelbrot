[package]
name = "mandelbrot"
version = "0.1.0"
edition = "2024"

[dependencies]
clipboard = "0.5.0"
cpu-time = "1.0.0"
crossbeam-channel = "0.5.15"
dashu = { version = "0.4.2", features = ["num-traits"] }
delegate = "0.13.2"
env_logger = "0.11.6"
hsl = "0.1.1"
indicatif = "0.17.9"
itertools = "0.14.0"
log = "0.4.25"
minifb = "0.27.0"
num = "0.4.3"
num-traits = "0.2.19"
ordered-float = "5.1.0"
palette = "0.7.6"
parking_lot = "0.12.3"
rand = "0.9.2"
rayon = "1.10.0"
#waker_interrupter = { git = "https://github.com/gorilskij/waker_interrupter" }
waker_interrupter = { path = "../waker_interrupter" }

[profile.release]
debug = true
