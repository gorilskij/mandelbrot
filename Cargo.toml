[package]
name = "mandelbrot"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
bytemuck = { version = "1.25.0", features = ["derive"] }
crossbeam-channel = "0.5.15"
dashu = { version = "0.4.3", features = ["num-traits"] }
delegate = "0.13.5"
env_logger = "0.11.10"
flurry = "0.5.2"
hsl = "0.1.1"
itertools = "0.14.0"
log = "0.4.32"
num = "0.4.3"
num-traits = "0.2.19"
ordered-float = "5.3.0"
parking_lot = "0.12.5"
pollster = "0.4.0"
rand = "0.10.1"
rayon = "1.12.0"
#waker_interrupter = { git = "https://github.com/gorilskij/waker_interrupter" }
waker_interrupter = { path = "../waker_interrupter" }
wgpu = "29.0.3"
winit = "0.30"

[profile.release]
debug = true
# debug-assertions = true
